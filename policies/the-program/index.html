<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Program</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0B0F14; color: #E7EAEE;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 72px 24px 96px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, #123B7A, #0E2A57);
    font-weight: 900; font-size: 30px; color: #fff; letter-spacing: -1px;
    box-shadow: 0 8px 30px rgba(18,59,122,.4);
  }
  h1 { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin: 26px 0 6px; }
  .tag { color: #9AA4B2; font-size: 17px; margin: 0 0 40px; }
  .links { display: flex; flex-wrap: wrap; gap: 14px; }
  a.card {
    display: block; padding: 18px 22px; border-radius: 14px;
    background: #131A22; border: 1px solid #222C38; color: #E7EAEE;
    text-decoration: none; font-weight: 700; font-size: 16px;
    transition: border-color .18s ease, background .18s ease;
  }
  a.card:hover { border-color: #3A5C93; background: #172029; }
  a.card span { display: block; font-weight: 500; font-size: 13px; color: #9AA4B2; margin-top: 3px; }
  footer { margin-top: 56px; color: #5C6675; font-size: 13px; }
  footer a { color: #7C93B8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">TP</div>
    <h1>The Program</h1>
    <p class="tag">A deep, single-player college football dynasty simulator for iOS.</p>
    <div class="links">
      <a class="card" href="privacy.html">Privacy Policy<span>How your data is handled</span></a>
      <a class="card" href="terms.html">Terms of Service<span>The rules for using the app</span></a>
    </div>
    <footer>
      Support: <a href="mailto:gacktaylor@gmail.com">gacktaylor@gmail.com</a>
    </footer>
  </div>
</body>
</html>
